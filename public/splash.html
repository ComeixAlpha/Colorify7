<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>colorify</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        background: #111318;
        color: #d0d3dc;
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        user-select: none;
        overflow: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
      }
      .spinner {
        width: 34px;
        height: 34px;
        border: 3px solid rgba(255, 255, 255, 0.14);
        border-top-color: #a8c7fa;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .title {
        font-size: 19px;
        font-weight: 600;
      }
      .hint {
        font-size: 13px;
        color: #8e9099;
      }
    </style>
  </head>
  <body>
    <div class="spinner"></div>
    <div class="title">colorify</div>
    <div class="hint" id="hint">正在启动…</div>
    <script>
      // 跟随系统语言切换提示文案
      var zh = /^zh/i.test(navigator.language || "");
      document.getElementById("hint").textContent = zh
        ? "正在启动…"
        : "Starting…";
    </script>
  </body>
</html>
